version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  rag-service:
    build: .
    container_name: rag-service
    restart: always
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      HF_HOME: "/root/.cache/huggingface"  # Use this inside container
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
      REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}  # Optional if using other models that need login
    volumes:
      # ✅ Mount local Hugging Face model cache into container
      - ~/.cache/huggingface:/root/.cache/huggingface  # Read-only is fine if models are pre-downloaded

volumes:
  qdrant_data: